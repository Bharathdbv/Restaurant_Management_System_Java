<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PORTAL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .accordion {
            max-width: 500px;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .accordion-section {
            background-color: #f9f9f9;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            padding: 10px;
            transition: background-color 0.3s ease;
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .accordion-section:hover {
            background-color: #e0e0e0;
        }

        .accordion-content {
            display: none;
            padding: 10px;
        }

        .active .accordion-content {
            display: block;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        select,
        button {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="text"],
        select {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #d3d0d067;
        }

        .logb {
            height: 40px;
            background-color: #198e19;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border-radius: 10px;
            width: 80px;
            margin-right: 30px;
        }

        button:hover {
            background-color: #0d5116;
        }

        .logo {
            font-family: ALGERIAN, Arial, sans-serif;
            font-size: 40px;
            font-weight: bold;
            color: #333;
            margin-right: auto;
            margin-left: 30px;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .success-msg {
            color: green;
            text-align: center;
        }

        .error-msg {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <span>BH</span>
        </div>
        <form action="/alogout" method="post">
            <button type="submit" class="logb">Logout</button>
        </form>
    </nav>

    <p th:if="${message}" class="success-msg" th:text="${message}"></p>
    <p th:if="${error}" class="error-msg" th:text="${error}"></p>

    <div class="accordion">

        <div class="accordion-section">
            <h2>UPDATE PRICE</h2>
            <div class="accordion-content">
                <form id="updatePriceForm" action="/updateprice" method="post" class="form-container">
                    <label for="category">Category:</label>
                    <select id="category" name="category">
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                    <label for="dishName">Dish Name:</label>
                    <select id="dishName" name="dishName">
                        <!-- Populated dynamically via JS -->
                    </select>
                    <label for="price">New Price:</label>
                    <input type="text" id="price" name="nprice" required>
                    <button type="submit">Update</button>
                </form>
            </div>
        </div>

        <div class="accordion-section">
            <h2>ADD ITEM</h2>
            <div class="accordion-content">
                <form id="addItemForm" action="/add-item" method="post" class="form-container">
                    <label for="addCategory">Category:</label>
                    <select id="addCategory" name="addCategory">
                        <option value="starter">Starters</option>
                        <option value="main_course">Main Course</option>
                        <option value="desserts">Desserts</option>
                    </select>
                    <label for="itemName">Item Name:</label>
                    <input type="text" id="itemName" name="itemName" required>
                    <label for="itemPrice">Price:</label>
                    <input type="text" id="itemPrice" name="itemPrice" required>
                    <button type="submit">Add</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const categoryDropdown = document.getElementById('category');
        const dishNameDropdown = document.getElementById('dishName');

        categoryDropdown.addEventListener('change', async () => {
            const selectedCategory = categoryDropdown.value;
            try {
                const response = await fetch(`/get-items?category=${selectedCategory}`);
                const data = await response.json();
                dishNameDropdown.innerHTML = '';
                data.items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item;
                    option.textContent = item;
                    dishNameDropdown.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching items:', error);
            }
        });

        const accordionSections = document.querySelectorAll('.accordion-section');
        accordionSections.forEach(section => {
            section.addEventListener('click', () => {
                section.classList.toggle('active');
            });
        });

        const formElements = document.querySelectorAll('.form-container *');
        formElements.forEach(element => {
            element.addEventListener('click', (event) => {
                event.stopPropagation();
            });
        });
    </script>
</body>

</html>
