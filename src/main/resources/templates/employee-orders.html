<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee Orders</title>
    <style>
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #cbc8c8c6;
        }

        .logb {
            height: 40px;
            background-color: #198e19;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border-radius: 10px;
            width: 60px;
        }

        button:hover {
            background-color: #166222;
        }

        .logo {
            font-family: ALGERIAN, Arial, sans-serif;
            font-size: 40px;
            font-weight: bold;
            color: #333;
            margin-right: auto;
            margin-left: 30px;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <span>BH</span>
        </div>
        <form action="/elogout" method="post">
            <button type="submit" class="logb">Logout</button>
        </form>
    </nav>
    <h1>Employee Orders</h1>

    <div th:if="${#lists.size(eorders) > 0}">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Table Number</th>
                    <th>Items</th>
                    <th>Generate Bill</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${eorders}">
                    <td th:text="${order.date}"></td>
                    <td th:text="${order.tnum}"></td>
                    <td th:text="${#strings.listJoin(order.items, ', ')}"></td>
                    <td>
                        <form method="POST" action="/generate-bill">
                            <input type="hidden" name="date" th:value="${order.date}">
                            <input type="hidden" name="tnum" th:value="${order.tnum}">
                            <input th:each="item : ${order.items}" type="hidden" name="items[]" th:value="${item}">
                            <button type="submit">Generate Bill</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${#lists.size(eorders) == 0}">No orders found for this employee.</p>
</body>

</html>
